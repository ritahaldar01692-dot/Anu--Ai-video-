
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anu AI Video Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <h1>🎬 Anu AI Video Generator</h1>

  <input type="file" id="image" accept="image/*">

  <textarea id="script" placeholder="Enter your script here..."></textarea>

  <select id="voice">
    <option>English Voice</option>
    <option>Hindi Voice</option>
    <option>Bangla Voice</option>
  </select>

  <button id="generateBtn">Generate Video</button>

  <p id="status"></p>
</div>

<script src="script.js"></script>

</body>
</html>
